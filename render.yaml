services:
  - type: web
    name: foodlink-backend
    env: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./foodlink.db
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://foodlink-frontend.onrender.com,http://localhost:3000,http://127.0.0.1:3000

  - type: web
    name: foodlink-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: VITE_API_BASE_URL=https://foodlink-backend.onrender.com NODE_ENV=production node server.js
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_API_BASE_URL
        value: https://foodlink-backend.onrender.com
      - key: NODE_ENV
        value: production
